name: shiftledger

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shiftledger}:${POSTGRES_PASSWORD:?Copy .env.example to .env}@postgres:5432/${POSTGRES_DB:-shiftledger}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Redis password required}@redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  S3_ENDPOINT_URL: http://storage:8333

x-app: &app
  image: shiftledger:local
  build:
    context: .
    target: runtime
  env_file: .env
  environment: *app-environment
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shiftledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?PostgreSQL password required}
      POSTGRES_DB: ${POSTGRES_DB:-shiftledger}
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis password required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Redis password required}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction']
    ports: ["127.0.0.1:${REDIS_PORT:-16379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports: ["127.0.0.1:${KAFKA_PORT:-19092}:19092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  storage:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: [mini, -dir=/data, -ip=storage, -ip.bind=0.0.0.0]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3 access key required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3 secret required}
      S3_BUCKET: ${S3_BUCKET:-shiftledger-receipts}
    ports: ["127.0.0.1:${S3_PORT:-18333}:8333"]
    volumes: [storage-data:/data]
    restart: unless-stopped

  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  bootstrap:
    <<: *app
    command: [python, -m, shiftledger.cli, bootstrap]
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
      storage: {condition: service_started}
    restart: "no"

  api:
    <<: *app
    ports: ["127.0.0.1:${API_PORT:-18000}:8000"]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=10)"]
      interval: 15s
      timeout: 12s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  outbox:
    <<: *app
    command: [python, -m, shiftledger.workers.outbox]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, shiftledger.workers.health, outbox]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  reconciliation:
    <<: *app
    command: [python, -m, shiftledger.workers.reconciliation]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, shiftledger.workers.health, reconciliation]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  seed:
    <<: *app
    profiles: [tools]
    command: [python, -m, shiftledger.cli, seed]
    depends_on:
      bootstrap: {condition: service_completed_successfully}

  test:
    image: shiftledger:tests
    build:
      context: .
      target: development
    profiles: [test]
    env_file: .env
    environment:
      <<: *app-environment
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shiftledger}:${POSTGRES_PASSWORD:?}@postgres:5432/shiftledger_test
      TEST_REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/15
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: [python, scripts/test.py]

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  storage-data:
