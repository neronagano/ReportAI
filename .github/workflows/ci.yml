name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version-file: "pyproject.toml"
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src
      - run: uv run --locked pytest tests/unit
      - name: Audit runtime dependencies
        run: |
          uv export --quiet --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/shiftledger-requirements.txt
          uv run --locked pip-audit --disable-pip --no-deps -r /tmp/shiftledger-requirements.txt

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cp .env.example .env
      - name: Build and start the stack
        run: docker compose up -d --build
      - run: docker compose run --rm seed
      - name: Unit and PostgreSQL integration tests
        run: docker compose run --rm --build test
      - name: HTTP and Kafka smoke checks
        run: |
          docker compose run --rm --no-deps test python scripts/smoke.py --base-url http://api:8000
          docker compose run --rm --no-deps test python scripts/check_messaging.py
      - name: Container state and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
      - run: docker compose down
        if: always()
